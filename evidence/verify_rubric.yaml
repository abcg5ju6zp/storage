rubrics:
  - id: 1
    type: f2p
    text: "删除前记录容器、镜像与层的完整引用快照，仍被引用的层不会进入清理。"
  - id: 2
    type: f2p
    text: "撤销容器和镜像引用后才卸载并删除层目录，依赖顺序可重复执行。"
  - id: 3
    type: f2p
    text: "卸载、索引写入或目录删除失败时保留上一份可读状态并留下可继续处理的意图。"
  - id: 4
    type: f2p
    text: "进程在任一步骤中止后重启会继续未完成步骤，不会重复删除已确认对象或复活旧引用。"
  - id: 5
    type: f2p
    text: "并发创建、挂载和删除同一层时最终只有一个一致层世代对读路径可见。"
  - id: 6
    type: f2p
    text: "镜像、容器和层查询不会返回半删除元数据或指向不存在目录的条目。"
  - id: 7
    type: p2p
    text: "只读存储、overlay 复用、锁定容器和既有崩溃恢复语义保持通过。"
  - id: 8
    type: p2p
    text: "未触发清理的普通创建、挂载和删除仍保持原有结果。"
